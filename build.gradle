plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
repositories {
//    maven { url 'https://maven.fabricmc.net/' }
maven { url 'https://maven.shedaniel.me/' }
maven { url 'https://maven.terraformersmc.com/releases/' }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // yarn從2025年後，不再使用
    // mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    // mappings loom.officialMojangMappings() 
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    localRuntime "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API. This is technically optional, but you probably want it anyway.
    // implementation 1.21.11版本
    // modImplementation 26.1取消
    // modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    localRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"


    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
//    implementation "me.shedaniel.cloth:config-2:${project.cloth_config_version}"
//    include "me.shedaniel.cloth:config-2:${project.cloth_config_version}"

    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding="UTF-8"
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// // jar {
//     from("LICENSE") {
//         rename { "${it}_${project.archivesBaseName}" }
//     }
// // }

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            // add all the jars that should be included when publishing to maven
            artifact(jar) {
                builtBy jar
            }
        }
    }

    // Select the repositories you want to publish to
    // To publish to maven local, no extra repositories are necessary. Just use the task `publishToMavenLocal`.
    repositories {
        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    }
}